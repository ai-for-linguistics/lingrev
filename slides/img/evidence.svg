ory</text><text x="391" y="23" font-size="12" font-weight="400">Medium</text><text x="470" y="23" font-size="12" font-weight="400">Suggestion</text><text x="543" y="23" font-size="12" font-weight="400">Open</text></g><g data-comment-detail="" transform="translate(0 231)"><rect x="28" width="584" height="145" fill="#f7f9fc" /><g data-comment-content="0" style="display:none"><text x="39" y="20" font-size="13" font-weight="700">Section 3 · Table 1</text><text x="39" y="43" font-size="12" font-weight="700">Evidence / basis:</text><text x="157" y="43" font-size="12" font-weight="400">12 / 24 = 50%; the prose says 60%.</text><text x="39" y="66" font-size="12" font-weight="700">What still needs testing:</text><text x="203" y="66" font-size="12" font-weight="400">Check the underlying records.</text><text x="39" y="89" font-size="12" font-weight="700">Next action:</text><text x="126" y="89" font-size="12" font-weight="400">Correct the prose after checking the records.</text><text x="39" y="112" font-size="12" font-weight="700">Current</text><text x="333" y="112" font-size="12" font-weight="700">Proposed</text><text x="39" y="135" font-size="13" font-weight="400">“60% chose the target.”</text><text x="333" y="135" font-size="13" font-weight="400">“50% chose the target.”</text><path d="M317 100V140" class="rule" /></g><g data-comment-content="1" style="display:none"><text x="39" y="20" font-size="13" font-weight="700">Section 4 · A candidate contrast</text><text x="39" y="43" font-size="12" font-weight="700">Evidence / basis:</text><text x="157" y="43" font-size="12" font-weight="400">The assistant predicts a contrast for Fact X.</text><text x="39" y="66" font-size="12" font-weight="700">What still needs testing:</text><text x="203" y="66" font-size="12" font-weight="400">Obtain judgments from speakers.</text><text x="39" y="89" font-size="12" font-weight="700">Next action:</text><text x="126" y="89" font-size="12" font-weight="400">Test the examples; update the theory if needed.</text><text x="39" y="112" font-size="12" font-weight="700">Current</text><text x="333" y="112" font-size="12" font-weight="700">Proposed</text><text x="39" y="135" font-size="13" font-weight="400">Fact X is untested.</text><text x="333" y="135" font-size="13" font-weight="400">A concrete speaker study.</text><path d="M317 100V140" class="rule" /></g><g data-comment-content="2"><text x="39" y="20" font-size="13" font-weight="700">Section 2 · Principle A</text><text x="39" y="43" font-size="12" font-weight="700">Evidence / basis:</text><text x="157" y="43" font-size="12" font-weight="400">The domain of Principle A is imprecise.</text><text x="39" y="66" font-size="12" font-weight="700">What still needs testing:</text><text x="203" y="66" font-size="12" font-weight="400">Check the revised principle against all facts.</text><text x="39" y="89" font-size="12" font-weight="700">Next action:</text><text x="126" y="89" font-size="12" font-weight="400">Specify the domain and test its predictions.</text><text x="39" y="112" font-size="12" font-weight="700">Current</text><text x="333" y="112" font-size="12" font-weight="700">Proposed</text><text x="39" y="135" font-size="13" font-weight="400">“Apply A when relevant.”</text><text x="333" y="135" font-size="13" font-weight="400">“Apply A to finite clauses.”</text><path d="M317 100V140" class="rule" /></g></g></svg>
