<text x="404" y="129" font-size="19" font-weight="700">Change the report.</text><text x="404" y="154" font-size="16">Group by paper section.</text>
<rect x="14" y="207" width="236" height="74" rx="12" class="pass"/>
<text x="28" y="236" font-size="18" font-weight="700">What should I do next?</text><text x="28" y="261" font-size="16">Fit it into a working day.</text>
<rect x="390" y="207" width="236" height="74" rx="12" class="conf"/>
<text x="404" y="237" font-size="19" font-weight="700">Make a slide deck/</text><text x="404" y="262" font-size="19" font-weight="700">handout.</text>
